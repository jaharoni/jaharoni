<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" role="img" aria-label="Justin Aharoni Principal Systems Architect and Creative Technologist">
  <defs>
    <!-- Tactile hairline & Fibonacci cadence: 8px, 13px, 21px, 34px, 55px -->
    <style>
      .display-serif { font-family: 'Instrument Serif', Georgia, serif; font-size: 34px; }
      .humanist-sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; padding: 13px; gap: 21px; }
      .mono-code { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
    </style>
    <linearGradient id="jBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0D0E"/>
      <stop offset="50%" stop-color="#11161B"/>
      <stop offset="100%" stop-color="#080A0C"/>
    </linearGradient>
    <linearGradient id="jBrass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <pattern id="jTactileHairline" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" rx="13" fill="url(#jBg)" stroke="#262936" stroke-width="1.5"/>
  <rect width="1200" height="340" rx="13" fill="url(#jTactileHairline)"/>
  <rect x="55" y="0" width="220" height="3" fill="url(#jBrass)"/>

  <!-- Header Kicker -->
  <g transform="translate(55, 34)">
    <circle cx="5" cy="-4" r="4" fill="#D4AF37"/>
    <text x="21" y="0" fill="#94A3B8" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="2.2">JUSTIN AHARONI · PRINCIPAL ARCHITECT &amp; CREATIVE TECHNOLOGIST</text>
    <text x="1090" y="0" text-anchor="end" fill="#64748B" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.5">NEW YORK · NORTH FORK · WORLDWIDE</text>
  </g>

  <line x1="55" y1="55" x2="1145" y2="55" stroke="#1E2433" stroke-width="1"/>

  <!-- Name & Dual Mandate -->
  <g transform="translate(55, 112)">
    <text x="0" y="0"><tspan fill="#FFFFFF" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="42" font-weight="800" letter-spacing="-0.8">Justin Aharoni</tspan><tspan fill="#D4AF37" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" dx="18" dy="-4">@jaharoni</tspan></text>

    <text x="0" y="34" fill="#CBD5E1" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="400">
      Founder &amp; Principal Systems Architect at WholeTroutMedia · Open-Source Systems Engineering  ·  Visual Storyteller &amp; Director
    </text>
    <text x="0" y="64" fill="#94A3B8" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14.5">
      High-concurrency distributed systems, Model Context Protocol (MCP) &amp; GPU inference, spatial computing, and commercial visual production.
    </text>
  </g>

  <!-- 3-Domain Practice Pillars -->
  <g transform="translate(55, 212)">
    <g transform="translate(0, 0)">
      <rect width="350" height="92" rx="8" fill="#131722" stroke="#22293A" stroke-width="1"/>
      <text x="21" y="28" fill="#60A5FA" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.4">PILLAR I · SYSTEMS &amp; AI ARCHITECTURE</text>
      <text x="21" y="52" fill="#F1F5F9" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Python, Rust, Go, TypeScript, C/C++, Ruby</text>
      <text x="21" y="74" fill="#94A3B8" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12">ASGI, MCP servers, CUDA inference &amp; consensus</text>
    </g>

    <g transform="translate(370, 0)">
      <rect width="350" height="92" rx="8" fill="#131722" stroke="#22293A" stroke-width="1"/>
      <text x="21" y="28" fill="#10B981" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.4">PILLAR II · OPEN-SOURCE STEWARDSHIP</text>
      <text x="21" y="52" fill="#F1F5F9" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">100.0% Codecov Patch Coverage Standard</text>
      <text x="21" y="74" fill="#94A3B8" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12">InvenTree, Uvicorn, OpenHMD, Litestar, Mergo</text>
    </g>

    <g transform="translate(740, 0)">
      <rect width="350" height="92" rx="8" fill="#131722" stroke="#22293A" stroke-width="1"/>
      <text x="21" y="28" fill="#D4AF37" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.4">PILLAR III · ATELIER &amp; VISUAL STUDIO</text>
      <text x="21" y="52" fill="#F1F5F9" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">justinaharoni.com · Studio &amp; Cinema</text>
      <text x="21" y="74" fill="#94A3B8" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Commercial photography, filmmaking &amp; spatial design</text>
    </g>
  </g>
</svg>
